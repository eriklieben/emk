# ruff settings for the Python in this repository (fw-nrf/dfu-verify.py and
# the snippets in the build scripts); CI's lint job runs `ruff check`.
line-length = 120
target-version = "py311"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PL", "RUF"]
# The DFU checks compare against byte offsets and field sizes of Nordic's
# package format, named where they repeat; the rest read clearer inline.
ignore = ["PLR2004"]
