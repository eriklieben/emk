# Firmware for the Corne with nice!nano v2 (nRF52840), using Embassy.
# Stage 1: left half over USB. Bluetooth and the split link come next.
[package]
name = "fw-nrf"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

# Standalone: built only for the ARM target, not with the host workspace.
[workspace]

[features]
default = ["left", "usb-only", "usb-log"]
# Development log over a USB serial port next to the keyboard (src/log.rs).
usb-log = []
# Which half this build is for. The right half is a standalone USB keyboard
# for now (testing its keys and OLED); the split link comes with Bluetooth.
left = []
right = []
# How interrupts are locked depends on the build: the plain single-core lock
# without Bluetooth; with Bluetooth MPSL provides it, since the radio's own
# interrupts must never be blocked by it.
usb-only = ["cortex-m/critical-section-single-core"]
# Bluetooth: Nordic's SoftDevice Controller under the links in `kb-ble`
# (trouble host). kb-ble is there in every build for its log ring; without
# this feature nothing of its Bluetooth code is used.
ble = [
    "dep:nrf-sdc",
    "dep:nrf-mpsl",
    "nrf-mpsl/critical-section-impl",
]

# For a half whose bootloader only accepts signed firmware (Adafruit 0.11.0
# with SIGNED_FW=1, docs/signed-bootloader.md): the log port's `boot` asks for
# serial DFU (GPREGRET 0x4E) instead of the UF2 drive (0x57). Both bootloaders
# understand both values, so this only makes the intent explicit.
signed-boot = []
# Lock the debug port (APPROTECT) at the first start. Irreversible without a
# full chip erase over SWD, which also erases the bonds and the bootloader.
# Only after the signed bootloader is proven on that half (build: LOCK=1).
debug-lock = []

# The same lint levels as the main workspace (../Cargo.toml, [workspace.lints]).
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
redundant_clone = "warn"
needless_collect = "warn"
use_self = "warn"
undocumented_unsafe_blocks = "warn"
# Allowed on purpose; the reasons are in ../Cargo.toml.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
similar_names = "allow"

[dependencies]
cortex-m = "0.7.10"
cortex-m-rt = { version = "0.7.7", features = ["set-vtor"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "time-driver-rtc1", "gpiote", "time", "unstable-pac"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
kb-ble = { path = "../ble" }
kb-core = { path = "../core" }
kb-display = { path = "../display" }
nrf-mpsl = { version = "0.4.0", features = ["nrf52840"], optional = true }
nrf-sdc = { version = "0.4.0", features = ["nrf52840", "peripheral", "central"], optional = true }
static_cell = "2.1.1"
usbd-hid = "0.10.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 2
panic = "abort"
